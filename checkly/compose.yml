# The demo, and beside it the optional check session.
#
# Profiles are a union: a service starts when any of its profiles is active.
# That is why each tunnel carries one profile of its own and the services the
# session always needs carry checkly, so that one tunnel or the other joins
# them and never both.
#
#   docker compose -f checkly/compose.yml up demo    runs the demo alone
#   bash checkly/scripts/session.sh up              is the entry for the session
#
# Every image is pinned by tag and digest. No credential, account id or
# hostname is written here: the session reads them from the environment, and
# checkly/.env when it exists.

services:
  # The demo, as docker run runs it. The two variables stay empty unless the
  # session sets them, and the router configuration is mounted where the
  # session's variable points, so that the file is present and inert until it
  # is named. The published image before 0.2.0 lacks the configuration opt-in,
  # so the session uses DEMO_IMAGE=sysml-federation:dev from make image until
  # that release. The healthcheck is the image's own.
  demo:
    image: ${DEMO_IMAGE:-ghcr.io/roarge/sysml-federation}
    ports:
      - "8080:8080"
    environment:
      - "SYSML_FEDERATION_ROUTER_CONFIG_PATH=${ROUTER_CONFIG_PATH:-}"
      - "LOG_LEVEL=${LOG_LEVEL:-}"
    volumes:
      - "./otel/router.yaml:/otel/router.yaml:ro"

  # The named tunnel: a hostname of the owner's, carried by a token.
  tunnel-named:
    profiles:
      - named
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "run"
    environment:
      - "TUNNEL_TOKEN=${TUNNEL_TOKEN}"
    depends_on:
      - demo

  # The quick tunnel: a hostname the edge hands out for the session, read by
  # the runner from the metrics endpoint on port 2000.
  tunnel-quick:
    profiles:
      - quick
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "--url"
      - "http://demo:8080"
      - "--metrics"
      - "0.0.0.0:2000"
    expose:
      - "2000"
    depends_on:
      - demo

  # The collector the router exports to. The local configuration forwards
  # every span to the viewer. The other one, chosen with
  # OTEL_COLLECTOR_CONFIG=collector-checkly.yaml, also forwards the spans the
  # monitoring service marked to its ingest endpoint, and opens a third port
  # for spans that arrive from outside under a bearer token.
  otel-collector:
    profiles:
      - checkly
    image: otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    command:
      - "--config"
      - "/etc/otel/${OTEL_COLLECTOR_CONFIG:-collector-local.yaml}"
    volumes:
      - "./otel/collector-local.yaml:/etc/otel/collector-local.yaml:ro"
      - "./otel/collector-checkly.yaml:/etc/otel/collector-checkly.yaml:ro"
    environment:
      - "CHECKLY_OTEL_API_KEY=${CHECKLY_OTEL_API_KEY:-}"
      - "OTEL_INGEST_TOKEN=${OTEL_INGEST_TOKEN:-}"
    expose:
      - "4317"
      - "4318"
      - "4320"

  # The trace viewer. The image's own configuration opens OTLP receivers on
  # 4317 and 4318 inside the network and the UI on 16686, published on the
  # host for a reader.
  jaeger:
    profiles:
      - checkly
    image: jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    ports:
      - "16686:16686"

  # The session runner: the check project mounted from this directory, its
  # dependencies in a named volume so that the host's tree is not written, and
  # the script that walks the session's twelve steps. The browser specs run on
  # the monitoring service's runners, never in this container, so no browser
  # is downloaded here. The grace period is what the destroy on stop needs.
  checkly:
    profiles:
      - checkly
    image: node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
    working_dir: /work
    volumes:
      - "./:/work"
      - "checkly-node-modules:/work/node_modules"
    environment:
      - "CHECKLY_API_KEY=${CHECKLY_API_KEY:-}"
      - "CHECKLY_ACCOUNT_ID=${CHECKLY_ACCOUNT_ID:-}"
      - "CHECKLY_ALERT_EMAIL=${CHECKLY_ALERT_EMAIL:-}"
      - "CHECKLY_WEBHOOK_URL=${CHECKLY_WEBHOOK_URL:-}"
      - "CHECKLY_DASHBOARD_SLUG=${CHECKLY_DASHBOARD_SLUG:-}"
      - "CHECKLY_STATUS_SLUG=${CHECKLY_STATUS_SLUG:-}"
      - "CHECKLY_INCIDENTS=${CHECKLY_INCIDENTS:-}"
      - "CHECKLY_MAINTENANCE=${CHECKLY_MAINTENANCE:-}"
      - "CHECKLY_PRIVATE_LOCATION_SLUG=${CHECKLY_PRIVATE_LOCATION_SLUG:-}"
      - "DEMO_HOSTNAME=${DEMO_HOSTNAME:-}"
      - "TUNNEL_MODE=${TUNNEL_MODE:-}"
      - "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1"
    command:
      - "bash"
      - "scripts/session.sh"
    stop_grace_period: 90s
    depends_on:
      - demo
      - otel-collector

  # The private-location route, on which the checks run from beside the demo
  # rather than from the monitoring service's public locations. It needs the
  # Team plan.
  checkly-agent:
    profiles:
      - checkly-private
    image: checkly/agent:8.9.0@sha256:5f2ab8b820d01039534049a26a7837c2f751cf90f61dc3bcdfd68a8a892970d2
    environment:
      - "API_KEY=${CHECKLY_PL_API_KEY:-}"

volumes:
  checkly-node-modules: {}
