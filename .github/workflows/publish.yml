name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

# One publish at a time. The group deliberately leaves the ref out, because two
# version tags are two different refs and a per-ref group would let them run
# together and race on the moving latest tag. Nothing in flight is cancelled: a
# run stopped between the push and the tag move would leave the registry in a
# state nobody chose, so a second tag waits instead.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # A two-platform build that hangs would otherwise hold a runner for six
    # hours. The build and the two read-backs take a few minutes.
    timeout-minutes: 30
    steps:
      # Every action is pinned to a commit, because this job holds packages:
      # write and a registry credential, and a re-pointed major tag would run
      # unseen code with it. The comment names the release the commit carries.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cross-compilation only: every stage that runs a command is built for
      # the build platform, so no QEMU is set up (C-49).
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
          # No latest tag from here, by decision rather than by omission. This
          # step runs before the image has been measured, and latest is what an
          # untagged pull returns, so it is moved by a later step that runs only
          # once the size gate has passed and only for a full release.
          flavor: |
            latest=false

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: examples/pipeline/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Off, so the index holds exactly two manifests (C-52), which the next
          # step now asserts rather than assumes.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Read the manifest back (SR-05, SR-06)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          index="$(docker buildx imagetools inspect --raw "$repo:$VERSION")"
          # Provenance and SBOM are off, so the index carries one manifest per
          # platform and nothing else. An extra entry is something to look at
          # before anyone pulls it.
          count="$(printf '%s' "$index" | jq '.manifests | length')"
          if [ "$count" != "2" ]; then
            echo "::error::$repo:$VERSION has a manifest count of $count, expected exactly 2"
            exit 1
          fi
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            digest="$(printf '%s' "$index" | jq -r --arg os "$os" --arg arch "$arch" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest')"
            if [ -z "$digest" ]; then
              echo "::error::$repo:$VERSION has no $platform manifest"
              exit 1
            fi
            # jq's add treats an absent or null size as zero, which would
            # under-count a platform instead of failing, so every size is
            # checked to be a number before any of them are summed. An empty
            # layers array is rejected here too.
            size="$(docker buildx imagetools inspect --raw "$repo@$digest" | jq -r '
              if (.layers | type) != "array" or (.layers | length) == 0 then
                "no layers"
              else
                [.layers[].size, .config.size]
                | if any(type != "number") then "a size is absent or not a number" else add end
              end')"
            # A size that is not a run of digits would make the comparison
            # below answer false and pass a platform nothing was measured
            # for, so it fails here instead.
            case "$size" in
              '' | *[!0-9]*)
                echo "::error::$platform reported no numeric compressed size, got '$size'"
                exit 1
                ;;
            esac
            echo "$platform: $size bytes compressed"
            if [ "$size" -gt 80000000 ]; then
              echo "::error::$platform is $size bytes compressed, over the 80 MB budget"
              exit 1
            fi
          done

      # Registry-counted sizes cannot be had without pushing, so the version tag
      # goes up first and is measured there. Only now does latest move. A gate
      # that fails takes the job down before this step, and latest keeps
      # pointing where it pointed, so an untagged pull never returns an image
      # the gate rejected. The version tag itself is left in the registry and
      # has to be deleted by hand.
      - name: Move latest to the measured image (SR-01)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          # A hyphen after the patch number is semver's pre-release marker and
          # {{version}} carries it through, so v0.1.0-rc1 arrives here as
          # 0.1.0-rc1 and is recognised rather than assumed away.
          case "$VERSION" in
            *-*)
              echo "$VERSION is a pre-release, so latest stays where it is"
              exit 0
              ;;
          esac
          # A second tag over the index that is already published, so nothing is
          # rebuilt and no blob is uploaded again: latest lands on the same
          # bytes the step above measured.
          docker buildx imagetools create --tag "$repo:latest" "$repo:$VERSION"
          echo "latest now points at $repo:$VERSION"
