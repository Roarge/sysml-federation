  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Source+Sans+3:wght@400;600&display=swap">
  <style>
    :root {

      --body: "Source Sans 3", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4; }
    a { color: var(--blue); } a:hover { color: var(--ink); }
    .board { width: 1440px; height: 900px; box-sizing: border-box; padding: 28px 36px; background: var(--paper); display: flex; flex-direction: column; gap: 12px; }
    .head { display: flex; flex-direction: row; gap: 16px; align-items: baseline; }
    .title { font-family: var(--display); font-size: 34px; line-height: 1; margin: 0; }
    .scope { font-size: 14px; color: var(--pencil); }
    .body { display: flex; flex-direction: row; gap: 24px; flex: 1 1 auto; min-height: 0; }
    .diagram { flex: 0 0 1000px; }
    .aside { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; min-width: 0; font-size: 13.5px; }
    .aside h4 { font-family: var(--display); font-size: 20px; margin: 0; line-height: 1; }
    .aside p { margin: 0; }
    .aside .legend { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--pencil); border-top: 1px dashed var(--pencil); padding-top: 8px; margin-top: auto; }
    .aside .legend span .sw { display: inline-block; width: 22px; height: 12px; border: 1.5px solid var(--ink); border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--paper); }
    .aside .legend span .sw.s { background: var(--shade); }
    .aside .legend span .sw.b { border-color: var(--blue); background: color-mix(in oklch, var(--blue) 12%, var(--paper)); }
    .aside .legend span .sw.d { border-style: dashed; }
  </style>
  <style>
    .board { width: 1587px; height: 1123px; padding: 40px; }
  </style>
  <style>
    @page { size: 1587px 1123px; margin: 0; }
    html, body { margin: 0; padding: 0; background: oklch(98% 0.005 90); }
    *, *::before, *::after { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  </style>
</head>
