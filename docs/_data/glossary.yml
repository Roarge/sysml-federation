# Definitions behind the click-to-define terms in the articles.
#
# An article marks a term as <span class="term" data-term="ID">text</span>.
# The article layout embeds this file in the page, and assets/site.js shows
# the definition in place when a reader clicks, taps or presses Enter on the
# term. Jekyll reads _data but never publishes it as a page, so this file is
# the one place a definition is written, and articles stay consistent by
# pointing at it.
#
# Two or three plain sentences in UK English per entry, written for a reader
# who knows either systems engineering or web APIs and not necessarily both.
# A link is optional and must have been checked by a live request.

- id: sysml-v2
  term: SysML v2
  definition: >-
    The second version of the Systems Modeling Language, the Object Management
    Group's standard for describing a system as a model: its parts, the
    properties they carry, the requirements they must meet and the links
    between them. Version 2 has its own textual notation, so a model can live
    as text files in Git.
  link: https://www.omg.org/spec/SysML/2.0

- id: router
  term: Router
  definition: >-
    In GraphQL federation, the single endpoint that clients talk to. It holds
    the merged schema, works out which service owns each field a query asks
    for, calls those services and puts their answers together. This demo uses
    the Cosmo router from WunderGraph.
  link: https://cosmo-docs.wundergraph.com/router/intro

- id: adapter
  term: Adapter
  definition: >-
    This project's service that reads a SysML v2 model from its text files and
    publishes it as a GraphQL subgraph. It knows the language and nothing about
    any particular model.
  link: https://github.com/Roarge/sysml-federation/tree/main/adapter

- id: projection
  term: Projection
  definition: >-
    The small, plainly typed view of a model that the adapter publishes. Other
    services see parts, attributes, connections and requirements rather than
    the full SysML metamodel, so they never need to learn SysML.

- id: decision-record
  term: Decision record
  definition: >-
    A short document that records one architectural decision: the context, the
    choice made, the alternatives that lost and the consequences. This project
    keeps its records in the form Michael Nygard proposed in 2011.
  link: https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions

- id: short-name
  term: Short name
  definition: >-
    A second, shorter name a SysML v2 element can carry, written between angle
    brackets and quotes, such as <'SR-22'>. This project uses short names as
    identifiers that people can type and that every service agrees on.

- id: satisfy
  term: Satisfy
  definition: >-
    A SysML relationship stating that a part of the design meets a requirement,
    as in "satisfy SR_22_EditsPatchTheSource by adapter". It records which part
    is answerable for which requirement.

- id: verification-case
  term: Verification case
  definition: >-
    A defined way of showing that a requirement is met, by test, analysis,
    inspection or demonstration. In SysML v2 it is a model element that names
    the requirement it verifies and the steps that make up the check.
  link: https://sebokwiki.org/wiki/System_Verification

- id: validation-case
  term: Validation case
  definition: >-
    Verification asks whether a system was built as specified. Validation asks
    whether it does what its users wanted. In this model a validation case
    checks a stakeholder story against recorded runs of the demo and browser
    tests.
  link: https://sebokwiki.org/wiki/System_Validation

- id: derivation
  term: Derivation
  definition: >-
    A link saying that one requirement follows from another, such as a limit
    on each server derived from a limit on the whole pipeline. SysML v2 writes
    it as a derivation connection with one original end and one or more
    derived ends.
  link: https://en.wikipedia.org/wiki/Requirements_traceability

- id: ears
  term: EARS
  definition: >-
    The Easy Approach to Requirements Syntax, published by Alistair Mavin and
    colleagues in 2009. It offers a handful of fixed sentence templates, such
    as "When [trigger], the [system] shall [response]", that make requirements
    shorter and less ambiguous.
  link: https://alistairmavin.com/ears/

- id: make-target
  term: Make target
  definition: >-
    A named recipe in a project's Makefile, run by typing make followed by its
    name, as in make check. This repository uses targets to bundle its checks
    so that one command runs them all.
  link: https://en.wikipedia.org/wiki/Make_(software)

- id: view
  term: View
  definition: >-
    A selection from a model that answers one audience's concerns, such as a
    deployment picture for the people who run the system. SysML v2 has views
    as model elements, and the ISO/IEC/IEEE 42010 standard for architecture
    descriptions defines views and the viewpoints that govern them.
  link: https://en.wikipedia.org/wiki/ISO/IEC_42010

- id: pilot-implementation
  term: OMG pilot implementation
  definition: >-
    The open-source Java tooling for SysML v2, developed alongside the standard
    and published by the Systems-Modeling project. This series treats it as one
    of the two reference tools that decide whether a model is valid SysML.
  link: https://github.com/Systems-Modeling/SysML-v2-Pilot-Implementation

- id: opensysml
  term: OpenSysML
  definition: >-
    An open-source SysML v2 parser and validator written in Go and published by
    the Open-MBEE community, with a command line that checks model files. It is
    the second reference tool this project uses, and it makes no claim of
    conformance to the standard.
  link: https://github.com/Open-MBEE/OpenSysML

- id: ci
  term: Continuous integration
  definition: >-
    The practice of building and testing every change automatically as soon as
    it is pushed, so that a mistake shows up within minutes. This repository
    runs its continuous integration on GitHub Actions.
  link: https://en.wikipedia.org/wiki/Continuous_integration

- id: checkly
  term: Checkly
  definition: >-
    A hosted monitoring service that runs API checks and browser tests against
    a live site on a schedule, and raises an alert when one fails. Its checks
    are written as code, so they can sit in a repository beside what they test.
  link: https://www.checklyhq.com/

- id: compose-profile
  term: Compose profile
  definition: >-
    Docker Compose starts several containers from one file. A profile is a
    named group of services in that file that only starts when asked for, so
    extra tooling can sit beside an application without running by default.
  link: https://docs.docker.com/compose/how-tos/profiles/

- id: tunnel
  term: Tunnel
  definition: >-
    A way to give a service on a private machine a public address. The machine
    keeps an outbound connection open to a provider, and the provider forwards
    requests back through it. The check session uses Cloudflare Tunnel, either
    named on your own hostname or quick on a temporary one.
  link: https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/

- id: opentelemetry
  term: OpenTelemetry
  definition: >-
    An open standard and set of tools for collecting traces, metrics and logs
    from software. Its collector is a separate process that receives this data
    and forwards it to wherever it is stored or shown.
  link: https://opentelemetry.io/docs/collector/

- id: server-sent-events
  term: Server-sent events
  definition: >-
    A web standard that lets a server push a stream of messages to a browser
    over one long-lived HTTP response. The demo uses it to tell both apps that
    the model or the document has changed.
  link: https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events

- id: trace
  term: Trace
  definition: >-
    A record of one request's path through a system, made up of spans. Reading
    a trace shows which services the request touched, in what order, and how
    long each step took.
  link: https://opentelemetry.io/docs/concepts/signals/traces/

- id: span
  term: Span
  definition: >-
    One timed step inside a trace, such as parsing a query or calling another
    service. Spans nest, so a trace reads as a tree of the work one request
    caused.
  link: https://opentelemetry.io/docs/concepts/signals/traces/

- id: xmi
  term: XMI
  definition: >-
    XML Metadata Interchange, the Object Management Group's XML format for
    exchanging models between tools. In practice each vendor wrote it a little
    differently, so a file one tool saved did not always read back cleanly in
    another.
  link: https://en.wikipedia.org/wiki/XML_Metadata_Interchange

- id: plm
  term: PLM
  definition: >-
    Product lifecycle management. The systems a manufacturer uses to hold a
    product's parts, drawings, versions and changes from first design to
    retirement.
  link: https://en.wikipedia.org/wiki/Product_lifecycle_management

- id: service-bus
  term: Service bus
  definition: >-
    An enterprise service bus puts one integration platform in the middle of
    an organisation's systems. Every system talks to the bus through an
    adapter, and a central team owns the shared data model and the rules that
    translate between systems.
  link: https://en.wikipedia.org/wiki/Enterprise_service_bus

- id: oslc
  term: OSLC
  definition: >-
    Open Services for Lifecycle Collaboration, a set of specifications for
    linking engineering tools through the web. Each tool publishes its objects
    at URLs and describes them in a shared format, so another tool can link to
    a requirement or a test without copying it.
  link: https://en.wikipedia.org/wiki/Open_Services_for_Lifecycle_Collaboration

- id: metamodel
  term: Metamodel
  definition: >-
    The model of a modelling language: the kinds of element it has and how
    they may relate. A tool that reads SysML v2 through its standard API gets
    elements described in these general terms, so it has to understand the
    metamodel before it can find something as ordinary as a requirement's
    text.
  link: https://en.wikipedia.org/wiki/Metamodeling

- id: control-plane
  term: Control plane
  definition: >-
    The central service of the Cosmo platform. Cosmo's command-line tool and
    web console use it to manage graphs, and routers talk to it while they
    run. This demo has none. I compose the schemas locally with the
    command-line tool, commit the result, and the router starts from that
    file.
  link: https://cosmo-docs.wundergraph.com/control-plane/intro

- id: goroutine
  term: Goroutine
  definition: >-
    A lightweight thread of execution in Go. One Go program can run thousands
    of them side by side, so the demo runs its three services as goroutines
    inside a single binary rather than as three separate programs.
  link: https://go.dev/tour/concurrency/1

- id: loopback
  term: Loopback
  definition: >-
    The network address a machine uses to talk to itself, 127.0.0.1 or
    localhost. A service listening only on loopback can be reached from inside
    the same container and from nowhere else.
  link: https://en.wikipedia.org/wiki/Localhost

- id: distroless
  term: Distroless
  definition: >-
    A family of minimal container base images from Google. They hold what a
    program needs to run and leave out the rest of a Linux distribution,
    including the shell and tools such as curl.
  link: https://github.com/GoogleContainerTools/distroless

- id: reverse-proxy
  term: Reverse proxy
  definition: >-
    A server that takes requests from outside and passes them on to a service
    behind it, returning that service's answer as if it were its own. Here the
    UI server does this for the router, so the router never has to be
    reachable itself.
  link: https://en.wikipedia.org/wiki/Reverse_proxy

- id: entity-resolver
  term: Entity resolver
  definition: >-
    The part of a federated service that answers for an object another
    service has already found. The router hands it the object's key, plus any
    fields the service said it requires, and gets back the fields this
    service adds to that object.
  link: https://www.apollographql.com/docs/graphos/schema-design/federated-schemas/entities/intro

- id: mutation
  term: Mutation
  definition: >-
    A GraphQL operation that changes data, as opposed to a query, which only
    reads it. Each mutation is a named field on the schema's Mutation type,
    with arguments saying what to change.
  link: https://graphql.org/learn/mutations/

- id: subscription
  term: Subscription
  definition: >-
    A GraphQL operation that stays open and pushes a new result to the client
    each time something happens on the server. Two of the demo's services use
    one to announce that their version number has changed.
  link: https://graphql.org/learn/subscriptions/

- id: traceability
  term: Traceability
  definition: >-
    Being able to follow each requirement back to the need it came from and
    forward to the design that meets it and the way it will be verified. A traceability table
    lists those links, so a requirement with nothing behind it or nothing
    testing it shows up as a gap.
  link: https://en.wikipedia.org/wiki/Requirements_traceability

- id: websocket
  term: WebSocket
  definition: >-
    A protocol that keeps one connection open in both directions, so either
    end can send a message whenever it has one. Browsers use it to receive
    pushed updates, and servers use it between themselves too.
  link: https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API

- id: gqlgen
  term: gqlgen
  definition: >-
    A Go library that generates the code of a GraphQL server from its schema.
    All three of the demo's services are built with it, and it supports the
    federation directives and subscriptions they need.
  link: https://gqlgen.com/

- id: es-modules
  term: ES modules
  definition: >-
    JavaScript's own module system, built into every current browser. A page
    can load code split across files with import and export, with no bundler
    or build step in between.
  link: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules
