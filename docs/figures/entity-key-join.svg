<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" role="img" aria-label="The adapter and the capacity service each declare the type Requirement with the key id. The adapter adds text and the capacity service adds verdict. A client sends one query for the text and verdict of PIPE-R1 to the router, which fetches from both services and returns one answer joined on the id.">
  <title>Two services, one key, one answer</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2227"/>
    </marker>
  </defs>
  <rect width="720" height="436" fill="#faf8f5"/>
  <g font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#1f2227">

    <!-- The adapter's share of Requirement -->
    <rect x="16" y="20" width="322" height="132" rx="3" fill="#e9e8e3" stroke="#777a80"/>
    <text x="30" y="44" font-size="12" font-weight="600" letter-spacing="0.8" fill="#555960">ADAPTER</text>
    <g font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="30" y="72">type Requirement @key(fields: "id") {</text>
      <text x="30" y="92" xml:space="preserve">  id: ID!</text>
      <text x="30" y="112" xml:space="preserve" font-weight="700">  text: String</text>
      <text x="30" y="132">}</text>
    </g>

    <!-- The capacity service's share of Requirement -->
    <rect x="382" y="20" width="322" height="132" rx="3" fill="#e9e8e3" stroke="#777a80"/>
    <text x="396" y="44" font-size="12" font-weight="600" letter-spacing="0.8" fill="#555960">CAPACITY SERVICE</text>
    <g font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="396" y="72">type Requirement @key(fields: "id") {</text>
      <text x="396" y="92" xml:space="preserve">  id: ID!</text>
      <text x="396" y="112" xml:space="preserve" font-weight="700">  verdict: Verdict!</text>
      <text x="396" y="132">}</text>
    </g>

    <!-- The router -->
    <rect x="250" y="200" width="220" height="60" rx="3" fill="#e2f0ff" stroke="#286cab" stroke-width="1.5"/>
    <text x="360" y="226" text-anchor="middle" font-size="18" font-weight="600" fill="#1d4f80">Router</text>
    <text x="360" y="248" text-anchor="middle" font-size="13" fill="#1d4f80">joins the two answers on id</text>

    <!-- The client's query -->
    <rect x="16" y="300" width="300" height="120" rx="3" fill="#faf8f5" stroke="#1f2227"/>
    <text x="30" y="324" font-size="12" font-weight="600" letter-spacing="0.8" fill="#555960">ONE QUERY</text>
    <g font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="30" y="350">requirement(id: "PIPE-R1") {</text>
      <text x="30" y="368" xml:space="preserve">  text</text>
      <text x="30" y="386" xml:space="preserve">  verdict</text>
      <text x="30" y="404">}</text>
    </g>

    <!-- The joined answer -->
    <rect x="404" y="300" width="300" height="120" rx="3" fill="#faf8f5" stroke="#1f2227"/>
    <text x="418" y="324" font-size="12" font-weight="600" letter-spacing="0.8" fill="#555960">ONE ANSWER</text>
    <text x="418" y="348" font-size="14">The pipeline shall sustain the</text>
    <text x="418" y="366" font-size="14">required query rate</text>
    <text x="418" y="384" font-size="12" fill="#555960">text, from the adapter</text>
    <text x="418" y="408" font-size="14" font-weight="700">FAIL</text>
    <text x="454" y="408" font-size="12" fill="#555960">verdict, from the capacity service</text>

    <!-- Arrows -->
    <g stroke="#1f2227" stroke-width="1.5" fill="none">
      <line x1="300" y1="200" x2="179" y2="155" marker-end="url(#arrow)"/>
      <line x1="420" y1="200" x2="541" y2="155" marker-end="url(#arrow)"/>
      <line x1="166" y1="300" x2="268" y2="263" marker-end="url(#arrow)"/>
      <line x1="452" y1="262" x2="552" y2="297" marker-end="url(#arrow)"/>
    </g>
    <g font-size="13" fill="#555960">
      <text x="226" y="192" text-anchor="end">fetches text</text>
      <text x="494" y="192">fetches verdict</text>
      <text x="206" y="278" text-anchor="end">sent once</text>
      <text x="514" y="278">returned once</text>
    </g>
  </g>
</svg>
