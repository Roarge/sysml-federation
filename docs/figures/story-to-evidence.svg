<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Story US-03 derives system requirement SR-22. The adapter satisfies SR-22. Verification case VC_SR_22 verifies it and names its evidence: six Go tests and one recorded run of the demo.">
  <title>From a story to its evidence</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2227"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#faf8f5"/>
  <g font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#1f2227">

    <!-- Stakeholder story -->
    <rect x="16" y="32" width="190" height="104" rx="3" fill="#e9e8e3" stroke="#777a80"/>
    <text x="30" y="56" font-size="12" font-weight="600" letter-spacing="0.8" fill="#555960">STAKEHOLDER STORY</text>
    <text x="30" y="82" font-size="18" font-weight="600">US-03</text>
    <text x="30" y="104" font-size="14">Raise a server that</text>
    <text x="30" y="122" font-size="14">is not the bottleneck</text>

    <!-- System requirement -->
    <rect x="265" y="32" width="190" height="104" rx="3" fill="#faf8f5" stroke="#1f2227" stroke-width="1.5"/>
    <text x="279" y="56" font-size="12" font-weight="600" letter-spacing="0.8" fill="#555960">SYSTEM REQUIREMENT</text>
    <text x="279" y="82" font-size="18" font-weight="600">SR-22</text>
    <text x="279" y="104" font-size="14">Edits patch the source</text>

    <!-- Part -->
    <rect x="514" y="32" width="190" height="104" rx="3" fill="#faf8f5" stroke="#777a80"/>
    <text x="528" y="56" font-size="12" font-weight="600" letter-spacing="0.8" fill="#555960">PART</text>
    <text x="528" y="82" font-size="18" font-weight="600">adapter</text>
    <text x="528" y="104" font-size="14">reads the model text</text>
    <text x="528" y="122" font-size="14">and patches edits</text>

    <!-- Verification case -->
    <rect x="265" y="196" width="190" height="68" rx="3" fill="#faf8f5" stroke="#777a80"/>
    <text x="279" y="220" font-size="12" font-weight="600" letter-spacing="0.8" fill="#555960">VERIFICATION CASE</text>
    <text x="279" y="248" font-size="17" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">VC_SR_22</text>

    <!-- Evidence -->
    <rect x="100" y="312" width="520" height="76" rx="3" fill="#e9e8e3" stroke="#777a80"/>
    <text x="116" y="336" font-size="12" font-weight="600" letter-spacing="0.8" fill="#555960">EVIDENCE, ONE ACTION EACH</text>
    <text x="116" y="358" font-size="14">six Go tests in adapter/model and adapter/projection</text>
    <text x="116" y="378" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">record: 2026-08-28 SR-12, SR-14, SR-22</text>

    <!-- Arrows -->
    <g stroke="#1f2227" stroke-width="1.5" fill="none">
      <line x1="206" y1="84" x2="263" y2="84" marker-end="url(#arrow)"/>
      <line x1="514" y1="84" x2="457" y2="84" marker-end="url(#arrow)"/>
      <line x1="360" y1="196" x2="360" y2="138" marker-end="url(#arrow)"/>
      <line x1="360" y1="264" x2="360" y2="310" marker-end="url(#arrow)"/>
    </g>
    <g font-size="13" fill="#555960">
      <text x="235" y="76" text-anchor="middle">derives</text>
      <text x="485" y="76" text-anchor="middle">satisfies</text>
      <text x="370" y="172">verifies</text>
      <text x="370" y="292">names</text>
    </g>
  </g>
</svg>
