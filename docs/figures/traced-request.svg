<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 456" width="680" height="456" role="img" aria-label="The trace the router records for one join query as a tree of thirteen spans: one server span at the root, six internal spans beneath it, three fetch spans under execute, one per subgraph, and one HTTP client span under each fetch.">
  <title>One join query, thirteen spans</title>
  <rect width="680" height="456" fill="#faf8f5"/>
  <g font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#1f2227">
    <text x="40" y="34" font-size="12" font-weight="600" letter-spacing="0.8" fill="#555960">ONE JOIN QUERY THROUGH THE ROUTER, AS A TREE OF SPANS</text>

    <!-- Tree connectors -->
    <g stroke="#777a80" stroke-width="1" fill="none">
      <path d="M52 78 V247 M52 97 H80 M52 127 H80 M52 157 H80 M52 187 H80 M52 217 H80 M52 247 H80"/>
      <path d="M92 258 V397 M92 277 H120 M92 337 H120 M92 397 H120"/>
      <path d="M132 288 V307 H160 M132 348 V367 H160 M132 408 V427 H160"/>
    </g>

    <!-- Root: the server span -->
    <rect x="40" y="56" width="340" height="22" rx="3" fill="#faf8f5" stroke="#1f2227" stroke-width="1.5"/>
    <text x="50" y="72" font-size="15" font-weight="600">the query, server span</text>

    <!-- Six internal spans -->
    <g font-size="15">
      <rect x="80" y="86" width="300" height="22" rx="3" fill="#e9e8e3"/>
      <text x="90" y="102">read the body</text>
      <rect x="80" y="116" width="300" height="22" rx="3" fill="#e9e8e3"/>
      <text x="90" y="132">parse</text>
      <rect x="80" y="146" width="300" height="22" rx="3" fill="#e9e8e3"/>
      <text x="90" y="162">normalise</text>
      <rect x="80" y="176" width="300" height="22" rx="3" fill="#e9e8e3"/>
      <text x="90" y="192">validate</text>
      <rect x="80" y="206" width="300" height="22" rx="3" fill="#e9e8e3"/>
      <text x="90" y="222">plan</text>
      <rect x="80" y="236" width="300" height="22" rx="3" fill="#e9e8e3"/>
      <text x="90" y="252">execute</text>
    </g>

    <!-- Three fetches, each with its HTTP call -->
    <g font-size="15">
      <rect x="120" y="266" width="300" height="22" rx="3" fill="#e2f0ff" stroke="#286cab"/>
      <text x="130" y="282" fill="#1d4f80">fetch from the model subgraph</text>
      <rect x="160" y="296" width="260" height="22" rx="3" fill="#faf8f5" stroke="#777a80"/>
      <text x="170" y="312">HTTP call to the adapter</text>

      <rect x="120" y="326" width="300" height="22" rx="3" fill="#e2f0ff" stroke="#286cab"/>
      <text x="130" y="342" fill="#1d4f80">fetch from the document subgraph</text>
      <rect x="160" y="356" width="260" height="22" rx="3" fill="#faf8f5" stroke="#777a80"/>
      <text x="170" y="372">HTTP call to the document service</text>

      <rect x="120" y="386" width="300" height="22" rx="3" fill="#e2f0ff" stroke="#286cab"/>
      <text x="130" y="402" fill="#1d4f80">fetch from the capacity subgraph</text>
      <rect x="160" y="416" width="260" height="22" rx="3" fill="#faf8f5" stroke="#777a80"/>
      <text x="170" y="432">HTTP call to the capacity service</text>
    </g>

    <!-- Counts -->
    <g font-size="13" fill="#555960">
      <path d="M440 86 H448 V258 H440" stroke="#777a80" fill="none"/>
      <text x="460" y="178">6 internal spans</text>
      <path d="M440 266 H448 V438 H440" stroke="#777a80" fill="none"/>
      <text x="460" y="348">3 fetch spans and</text>
      <text x="460" y="365">3 HTTP client spans</text>
      <text x="460" y="72">1 server span</text>
    </g>
  </g>
</svg>
