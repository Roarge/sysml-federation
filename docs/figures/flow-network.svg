<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" width="720" height="408" role="img" aria-label="The shipped pipeline as a flow network. Each server is split into an in-node and an out-node joined by an edge whose capacity is its throughput: ingest 2000, parse 1200, indexA 700, indexB 700, serve 1800. Connections become edges with no limit. A super-source feeds ingest and serve feeds a super-sink. The minimum cut is the parse edge, at 1200.">
  <title>The shipped wiring as a flow network</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#777a80"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2227"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect width="720" height="408" fill="#faf8f5"/>
  <g font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#1f2227">

    <!-- Connections: no limit -->
    <g stroke="#777a80" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
      <line x1="48" y1="170" x2="86" y2="170" marker-end="url(#arrow)"/>
      <line x1="170" y1="170" x2="224" y2="170" marker-end="url(#arrow)"/>
      <line x1="308" y1="170" x2="384" y2="104" marker-end="url(#arrow)"/>
      <line x1="308" y1="170" x2="384" y2="236" marker-end="url(#arrow)"/>
      <line x1="470" y1="96" x2="528" y2="162" marker-end="url(#arrow)"/>
      <line x1="470" y1="244" x2="528" y2="178" marker-end="url(#arrow)"/>
      <line x1="614" y1="170" x2="664" y2="170" marker-end="url(#arrow)"/>
    </g>

    <!-- Server edges: capacity = throughput -->
    <g stroke="#1f2227" stroke-width="4" fill="none">
      <line x1="100" y1="170" x2="152" y2="170" marker-end="url(#arrow-ink)"/>
      <line x1="400" y1="96" x2="452" y2="96" marker-end="url(#arrow-ink)"/>
      <line x1="400" y1="244" x2="452" y2="244" marker-end="url(#arrow-ink)"/>
      <line x1="544" y1="170" x2="596" y2="170" marker-end="url(#arrow-ink)"/>
    </g>
    <line x1="238" y1="170" x2="290" y2="170" stroke="#b3261e" stroke-width="4" marker-end="url(#arrow-red)"/>

    <!-- Nodes -->
    <g fill="#faf8f5" stroke="#1f2227" stroke-width="1.5">
      <circle cx="36" cy="170" r="12"/>
      <circle cx="94" cy="170" r="6"/><circle cx="162" cy="170" r="6"/>
      <circle cx="394" cy="96" r="6"/><circle cx="462" cy="96" r="6"/>
      <circle cx="394" cy="244" r="6"/><circle cx="462" cy="244" r="6"/>
      <circle cx="538" cy="170" r="6"/><circle cx="606" cy="170" r="6"/>
      <circle cx="678" cy="170" r="12"/>
    </g>
    <g fill="#faf8f5" stroke="#b3261e" stroke-width="1.5">
      <circle cx="232" cy="170" r="6"/><circle cx="300" cy="170" r="6"/>
    </g>
    <text x="36" y="175" text-anchor="middle" font-size="14" font-style="italic">s</text>
    <text x="678" y="175" text-anchor="middle" font-size="14" font-style="italic">t</text>

    <!-- Throughput labels -->
    <g font-size="15" font-weight="600" text-anchor="middle">
      <text x="128" y="158">2000</text>
      <text x="266" y="158" fill="#b3261e">1200</text>
      <text x="428" y="84">700</text>
      <text x="428" y="232">700</text>
      <text x="572" y="158">1800</text>
    </g>
    <!-- Server names -->
    <g font-size="13" fill="#555960" text-anchor="middle">
      <text x="128" y="196">ingest</text>
      <text x="266" y="196" fill="#b3261e">parse</text>
      <text x="428" y="122">indexA</text>
      <text x="428" y="270">indexB</text>
      <text x="572" y="196">serve</text>
      <text x="36" y="200">source</text>
      <text x="678" y="200">sink</text>
    </g>

    <!-- The cut -->
    <g stroke="#b3261e" stroke-width="1.5" stroke-dasharray="2 4">
      <line x1="266" y1="40" x2="266" y2="142"/>
      <line x1="266" y1="162" x2="266" y2="180"/>
      <line x1="266" y1="202" x2="266" y2="290"/>
    </g>
    <text x="276" y="52" font-size="13" fill="#b3261e" font-weight="600">minimum cut: parse, 1200</text>

    <!-- Legend -->
    <line x1="16" y1="316" x2="704" y2="316" stroke="#e9e8e3"/>
    <line x1="24" y1="344" x2="72" y2="344" stroke="#1f2227" stroke-width="4" marker-end="url(#arrow-ink)"/>
    <text x="84" y="349" font-size="13">a server: in-node to out-node, limited to its throughput</text>
    <line x1="24" y1="370" x2="72" y2="370" stroke="#777a80" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="84" y="375" font-size="13">a connection, or a link from the source or to the sink: no limit</text>
    <text x="24" y="398" font-size="12" fill="#555960">Queries per second. The source feeds every server nobody feeds, and every server that feeds nobody feeds the sink.</text>
  </g>
</svg>
