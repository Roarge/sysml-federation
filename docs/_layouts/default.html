<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
{%- include head.html %}
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  {%- include header.html %}
  <main id="content">
    {%- if page.layout == 'default' %}
    <article class="prose">
      {%- if page.title %}
      <h1>{{ page.title }}</h1>
      {%- endif %}
      {{ content }}
    </article>
    {%- else %}
    {{ content }}
    {%- endif %}
  </main>
  {%- include footer.html %}
</body>
</html>
